<div class="p-card">
    <h2>Lecturer Panel</h2>
  
    <!-- Button to add lectures -->
    <button pButton label="Add Lecture" class="p-button-success" (click)="addLecture()"></button>
  
    <!-- Button to edit lectures -->
    <button pButton label="Edit Lecture" class="p-button-warning" (click)="editLecture()"></button>
  
    <!-- Button to delete lectures -->
    <button pButton label="Delete Lecture" class="p-button-danger" (click)="deleteLecture()"></button>
  
    <!-- Logout button -->
    <button pButton label="Logout" class="p-button-danger" (click)="logout()"></button>
  </div>
